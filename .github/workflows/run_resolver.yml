name: Resolve Google News RSS

on:
  schedule:
    # 8:00 AM to 10:30 AM EST (13:00 to 15:30 UTC)
    - cron: '0,30 13-15 * * *'
    # 11:00 AM and 11:30 AM EST (16:00 and 16:30 UTC)
    - cron: '0,30 16 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run resolver script
        run: |
          python resolve_news.py --output resolved_news.xml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resolved_news.xml cache.json
          git commit -m "Update resolved Google News RSS and cache" || echo "No changes to commit"
          git push
